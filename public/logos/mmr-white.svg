<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="100%" height="100%" fill="none" role="img" aria-label="MMR Safety Nets and Invisible Grills - White Logo">
  <title>MMR Safety Nets and Invisible Grills - White Logo (Dark Backgrounds)</title>

  <!-- Left Architectural Shield Emblem (White & Sky Blue) -->
  <g id="logo-emblem" transform="translate(6, 4)">
    <!-- 1. Architectural Roof Gable (Animation Step 1) -->
    <path id="logo-roof" class="anim-roof"
      d="M 5 26 L 33 4 L 61 26"
      fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Architectural Truss Accent (Sky Blue) -->
    <path id="logo-roof-truss" class="anim-roof-accent"
      d="M 16 26 L 33 13 L 50 26"
      fill="none" stroke="#64B5E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 2. Protective Shield Cradle (Animation Step 3) -->
    <path id="logo-shield" class="anim-shield"
      d="M 61 26 L 61 42 C 61 53 47 61 33 64 C 19 61 5 53 5 42 L 5 26"
      fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Tensile Safety Grid -->
    <path id="logo-wires" class="anim-wires"
      d="M 14 28 L 14 40 C 14 49 25 55 33 58 C 41 55 52 49 52 40 L 52 28"
      fill="none" stroke="#AEB8C2" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75" />

    <!-- 3. MMR Monogram (Animation Step 2) -->
    <g id="logo-mmr" class="anim-mmr">
      <!-- First M (White) -->
      <path d="M 13.5 49 L 13.5 29 L 19.5 41 L 25.5 29 L 25.5 49"
        fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Second M (White) -->
      <path d="M 27.5 49 L 27.5 29 L 33.5 41 L 39.5 29 L 39.5 49"
        fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- R (Sky Blue Accent) -->
      <path d="M 42 49 L 42 29 L 48.5 29 C 52 29 54 30.8 54 34 C 54 37.2 52 39 48.5 39 L 42 39 M 47.5 39 L 54 49"
        fill="none" stroke="#64B5E8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Apex Keystone -->
    <polygon id="logo-keystone" points="33,1 36.5,5.5 29.5,5.5" fill="#64B5E8" />
  </g>

  <!-- Right Typography Lockup (White & Accents) -->
  <g id="logo-typography" transform="translate(82, 0)">
    <!-- Primary Name "MMR" (Pure White) -->
    <text id="logo-wordmark" x="0" y="32"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="28" font-weight="900" letter-spacing="0.08em" fill="#FFFFFF">MMR</text>

    <!-- 4. Company Name (Animation Step 4) -->
    <text id="logo-company-name" class="anim-company" x="0" y="47"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="9.5" font-weight="700" letter-spacing="0.14em" fill="#F5F8FB">
      SAFETY NETS &amp; INVISIBLE GRILLS
    </text>

    <!-- 5. Tagline (Animation Step 5) -->
    <text id="logo-tagline" class="anim-tagline" x="0" y="60"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="8" font-weight="600" letter-spacing="0.18em" fill="#AEB8C2">
      SAFETY &#8226; STYLE &#8226; PEACE OF MIND
    </text>
  </g>
</svg>
